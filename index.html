                                    <textarea name="message" placeholder="Pesan/Kriteria Properti" onChange={handleChange} className="w-full p-2 border rounded text-gray-800" rows="3" required></textarea>
                                    <button className="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700">Kirim WhatsApp</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="bg-gray-900 text-gray-400 py-10 text-center">
                <div className="container mx-auto px-4">
                    <h3 className="text-white text-xl font-bold mb-4">Properti Kediri - Bams Raqila</h3>
                    <p className="text-sm mb-6">Spesialis Rumah Subsidi Kediri, Blitar, Jombang & Nganjuk.</p>
                    <div className="text-xs">&copy; {new Date().getFullYear()} Bams Raqila. All Rights Reserved.</div>
                </div>
            </footer>
        );

        // --- NEW COMPONENT: FLOATING WHATSAPP ---
        const FloatingWA = () => (
            <a href="https://wa.me/6281939892449?text=Halo%20Mas%20Bams,%20saya%20mau%20tanya%20properti"
               target="_blank"
               className="fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:bg-green-600 transition z-50 animate-pulse-custom cursor-pointer"
               title="Hubungi via WhatsApp">
                <i className="fab fa-whatsapp fa-2x"></i>
            </a>
        );

        const App = () => (
            <div className="antialiased relative">
                <Navbar />
                <Hero />
                <ListingSection />
                <AgentSection />
                <Testimonial />
                <Contact />
                <Footer />
                <FloatingWA />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
